<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食神小錢包</title>
    <style>
        :root {
            --primary: #1b365d;
            --accent: #d97706;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --success: #059669;
            --danger: #dc2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 500px; margin: 0 auto; }
        
        /* Header & Dashboard */
        .header { text-align: center; margin-bottom: 16px; }
        .header h1 { color: var(--primary); font-size: 1.5rem; font-weight: 700; }
        
        .kpi-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .kpi-card { background: var(--card-bg); padding: 16px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .kpi-title { font-size: 0.85rem; color: #6b7280; font-weight: 600; margin-bottom: 6px; }
        .kpi-value { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
        
        /* Buttons Group */
        .btn-group-primary { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 10px; }
        .btn-group-secondary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        
        .add-btn { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(27,54,93,0.25); }
        .add-btn:active { transform: scale(0.98); }
        
        .undo-btn { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; padding: 10px 4px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-align: center; }
        .history-btn { background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; padding: 10px 4px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-align: center; }
        .reset-btn { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; padding: 10px 4px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-align: center; }
        
        /* Modal Pop-up */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: flex-end; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; padding: 24px; animation: slideUp 0.25s ease-out; max-height: 85vh; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; color: #374151; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; }
        .type-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .type-btn { padding: 12px; border: 2px solid #e5e7eb; background: white; border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center; }
        .type-btn.active { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
        
        .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: #f3f4f6; color: #4b5563; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        
        /* Records List */
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .list-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
        .cycle-badge { font-size: 0.75rem; background: #e5e7eb; padding: 4px 8px; border-radius: 6px; font-weight: 600; color: #374151; }
        
        .record-card { background: white; padding: 14px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .record-info div:first-child { font-weight: 700; font-size: 0.95rem; }
        .record-info div:last-child { font-size: 0.8rem; color: #6b7280; margin-top: 2px; }
        .record-amount { text-align: right; }
        .record-cost { font-size: 1rem; font-weight: 700; }
        .record-diff { font-size: 0.8rem; font-weight: 600; }
        .surplus { color: var(--success); }
        .deficit { color: var(--danger); }
        .badge { display: inline-block; padding: 2px 6px; font-size: 0.75rem; border-radius: 4px; font-weight: 600; margin-right: 4px; }
        .badge-luxury { background: #fef3c7; color: #92400e; }
        .badge-simple { background: #e0f2fe; color: #075985; }
        
        /* History Modal Styling */
        .history-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .history-header { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 8px; border-bottom: 1px solid #cbd5e1; padding-bottom: 6px; }
        .history-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.85rem; color: #475569; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🍱 食神小錢包</h1>
    </div>

    <!-- KPI Dashboard -->
    <div class="kpi-container">
        <div class="kpi-card">
            <div class="kpi-title">本週期豪華大餐剩額</div>
            <div class="kpi-value" id="luxury-left">5 次</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">食神小錢包結餘</div>
            <div class="kpi-value" id="total-balance">$0</div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="btn-group-primary">
        <button class="add-btn" onclick="openModal()">➕ 記一筆 (Pop-up 記帳)</button>
    </div>
    
    <div class="btn-group-secondary">
        <button class="undo-btn" onclick="deleteLastStep()">↩️ 刪除上一筆</button>
        <button class="history-btn" onclick="openHistoryModal()">📜 歷屆紀錄</button>
        <button class="reset-btn" onclick="confirmResetCycle()">🔄 重置週期</button>
    </div>

    <!-- Recent Records List -->
    <div class="list-header">
        <div class="list-title">當前週期消費紀錄</div>
        <div class="cycle-badge" id="current-cycle-id">週期 #1</div>
    </div>
    <div id="records-list"></div>

    <!-- Pop-up Form Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 style="font-size: 1.2rem; margin-bottom: 16px; text-align: center;">新增餐食記錄</h2>
            
            <div class="form-group">
                <label>日期</label>
                <input type="date" id="input-date" class="form-control">
            </div>

            <div class="form-group">
                <label>餐點類型</label>
                <div class="type-selector">
                    <div class="type-btn active" id="btn-luxury" onclick="selectType('豪華大餐')">豪華大餐 ($200)</div>
                    <div class="type-btn" id="btn-simple" onclick="selectType('簡樸餐')">簡樸餐 ($100)</div>
                </div>
            </div>

            <div class="form-group">
                <label>食咗啲咩</label>
                <input type="text" id="input-name" class="form-control" placeholder="例：日式燒肉放題">
            </div>

            <div class="form-group">
                <label>食咗幾多錢 ($)</label>
                <input type="number" id="input-cost" class="form-control" placeholder="例：180">
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-save" onclick="saveRecord()">儲存記錄</button>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div class="modal" id="history-modal">
        <div class="modal-content">
            <h2 style="font-size: 1.2rem; margin-bottom: 16px; text-align: center;">📜 歷屆週期紀錄</h2>
            <div id="history-list"></div>
            <div style="margin-top: 16px;">
                <button class="btn-cancel" style="width: 100%;" onclick="closeHistoryModal()">關閉</button>
            </div>
        </div>
    </div>

    <script>
        let selectedType = '豪華大餐';
        
        // Data Structure
        let currentCycleId = parseInt(localStorage.getItem('god_cookery_cycle_id') || '1');
        let records = JSON.parse(localStorage.getItem('god_cookery_records_v2') || '[]');
        let pastCycles = JSON.parse(localStorage.getItem('god_cookery_past_cycles') || '[]');

        // Migration from old records
        const oldRecords = JSON.parse(localStorage.getItem('god_cookery_records') || '[]');
        if (oldRecords.length > 0 && records.length === 0) {
            records = oldRecords.map(r => ({ ...r, cycleId: currentCycleId }));
            localStorage.setItem('god_cookery_records_v2', JSON.stringify(records));
            localStorage.removeItem('god_cookery_records');
        }

        function init() {
            document.getElementById('input-date').valueAsDate = new Date();
            render();
        }

        function selectType(type) {
            selectedType = type;
            if(type === '豪華大餐') {
                document.getElementById('btn-luxury').classList.add('active');
                document.getElementById('btn-simple').classList.remove('active');
            } else {
                document.getElementById('btn-luxury').classList.remove('active');
                document.getElementById('btn-simple').classList.add('active');
            }
        }

        function openModal() {
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function openHistoryModal() {
            renderHistory();
            document.getElementById('history-modal').classList.add('active');
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').classList.remove('active');
        }

        function saveRecord() {
            const dateVal = document.getElementById('input-date').value;
            const nameVal = document.getElementById('input-name').value.trim();
            const costVal = parseFloat(document.getElementById('input-cost').value);

            if(!dateVal || !nameVal || isNaN(costVal)) {
                alert('請完整填寫日期、食咗啲咩及金額！');
                return;
            }

            const budget = selectedType === '豪華大餐' ? 200 : 100;
            const diff = budget - costVal;

            const newRecord = {
                id: Date.now(),
                cycleId: currentCycleId,
                date: dateVal,
                type: selectedType,
                name: nameVal,
                cost: costVal,
                budget: budget,
                diff: diff
            };

            records.unshift(newRecord);
            localStorage.setItem('god_cookery_records_v2', JSON.stringify(records));
            
            document.getElementById('input-name').value = '';
            document.getElementById('input-cost').value = '';
            closeModal();
            render();
        }

        function deleteLastStep() {
            const activeIndex = records.findIndex(r => r.cycleId === currentCycleId);
            if (activeIndex === -1) {
                alert('當前週期沒有可刪除的記錄！');
                return;
            }

            const lastRecord = records[activeIndex];
            if (confirm(`確定要刪除最近輸入的上一筆記錄嗎？

📌 「${lastRecord.name}」 ($${lastRecord.cost})`)) {
                records.splice(activeIndex, 1);
                localStorage.setItem('god_cookery_records_v2', JSON.stringify(records));
                render();
            }
        }

        function confirmResetCycle() {
            const activeRecords = records.filter(r => r.cycleId === currentCycleId);
            if (activeRecords.length === 0) {
                alert('當前週期暫無任何消費記錄，無需重置！');
                return;
            }

            if (confirm('確定要結束當前週期並開啟新週期嗎？舊紀錄將會完整存檔在「歷屆紀錄」中。')) {
                const luxuryCount = activeRecords.filter(r => r.type === '豪華大餐').length;
                const totalBalance = activeRecords.reduce((sum, r) => sum + r.diff, 0);
                
                const cycleSummary = {
                    cycleId: currentCycleId,
                    startDate: activeRecords[activeRecords.length - 1].date,
                    endDate: activeRecords[0].date,
                    luxuryUsed: luxuryCount,
                    totalBalance: totalBalance,
                    recordCount: activeRecords.length
                };

                pastCycles.unshift(cycleSummary);
                localStorage.setItem('god_cookery_past_cycles', JSON.stringify(pastCycles));

                // Increment Cycle
                currentCycleId += 1;
                localStorage.setItem('god_cookery_cycle_id', currentCycleId.toString());

                render();
                alert(`成功開啟新週期 (週期 #${currentCycleId})！舊週期紀錄已儲存。`);
            }
        }

        function render() {
            document.getElementById('current-cycle-id').innerText = `週期 #${currentCycleId}`;

            // Filter records for active cycle
            const activeRecords = records.filter(r => r.cycleId === currentCycleId);

            // Calculate KPIs for current cycle
            const luxuryCount = activeRecords.filter(r => r.type === '豪華大餐').length;
            const luxuryLeft = Math.max(0, 5 - luxuryCount);
            const totalBalance = activeRecords.reduce((sum, r) => sum + r.diff, 0);

            // Render KPIs
            document.getElementById('luxury-left').innerText = `${luxuryLeft} 次`;
            document.getElementById('total-balance').innerText = `${totalBalance >= 0 ? '+' : ''}$${totalBalance}`;
            document.getElementById('total-balance').style.color = totalBalance >= 0 ? '#059669' : '#dc2626';

            // Render Current Cycle Records List
            const listEl = document.getElementById('records-list');
            if(activeRecords.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; color:#9ca3af; padding:20px;">當前週期暫無消費記錄</div>';
                return;
            }

            listEl.innerHTML = activeRecords.map(r => `
                <div class="record-card">
                    <div class="record-info">
                        <div>
                            <span class="badge ${r.type === '豪華大餐' ? 'badge-luxury' : 'badge-simple'}">${r.type}</span>
                            ${r.name}
                        </div>
                        <div>${r.date} (預算 $${r.budget})</div>
                    </div>
                    <div class="record-amount">
                        <div class="record-cost">$${r.cost}</div>
                        <div class="record-diff ${r.diff >= 0 ? 'surplus' : 'deficit'}">
                            ${r.diff >= 0 ? '盈餘 +' : '超支 '}$${Math.abs(r.diff)}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderHistory() {
            const historyListEl = document.getElementById('history-list');
            if (pastCycles.length === 0) {
                historyListEl.innerHTML = '<div style="text-align:center; color:#9ca3af; padding:20px;">暫無已封存的歷屆週期紀錄</div>';
                return;
            }

            historyListEl.innerHTML = pastCycles.map(c => `
                <div class="history-card">
                    <div class="history-header">
                        <span>週期 #${c.cycleId}</span>
                        <span style="color: ${c.totalBalance >= 0 ? '#059669' : '#dc2626'}">
                            結餘: ${c.totalBalance >= 0 ? '+' : ''}$${c.totalBalance}
                        </span>
                    </div>
                    <div class="history-summary">
                        <div>🗓️ 日期範圍: ${c.startDate} ~ ${c.endDate}</div>
                        <div>🍱 豪華大餐已食: ${c.luxuryUsed} / 5 次</div>
                        <div>📝 總消費筆數: ${c.recordCount} 筆</div>
                    </div>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
