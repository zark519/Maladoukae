<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全功能生活財務理財及九巴月票小幫手</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- 主應用組件 ---
        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            
            // 數據持久化 State
            const [kmbData, setKmbData] = useState(() => {
                const saved = localStorage.getItem('kmb_data');
                return saved ? JSON.parse(saved) : {
                    startDate: new Date().toISOString().split('T')[0],
                    records: [],
                    passPrice: 450,
                    savedTarget: 2000
                };
            });

            const [diningData, setDiningData] = useState(() => {
                const saved = localStorage.getItem('dining_data');
                return saved ? JSON.parse(saved) : {
                    history: [
                        { id: 1, cycleName: '第一期 (示範)', startLuxuryCount: 3, currentLuxuryCount: 3, savedAmount: 450, notes: '運作良好' }
                    ]
                };
            });

            const [sportData, setSportData] = useState(() => {
                const saved = localStorage.getItem('sport_data');
                return saved ? JSON.parse(saved) : {
                    monthlyTarget: 15,
                    records: []
                };
            });

            const [wishData, setWishData] = useState(() => {
                const saved = localStorage.getItem('wish_data');
                return saved ? JSON.parse(saved) : {
                    items: []
                };
            });

            const [travelData, setTravelData] = useState(() => {
                const saved = localStorage.getItem('travel_data');
                return saved ? JSON.parse(saved) : {
                    trips: []
                };
            });

            const [debtData, setDebtData] = useState(() => {
                const saved = localStorage.getItem('debt_data');
                return saved ? JSON.parse(saved) : {
                    loans: []
                };
            });

            // LocalStorage 同步
            useEffect(() => { localStorage.setItem('kmb_data', JSON.stringify(kmbData)); }, [kmbData]);
            useEffect(() => { localStorage.setItem('dining_data', JSON.stringify(diningData)); }, [diningData]);
            useEffect(() => { localStorage.setItem('sport_data', JSON.stringify(sportData)); }, [sportData]);
            useEffect(() => { localStorage.setItem('wish_data', JSON.stringify(wishData)); }, [wishData]);
            useEffect(() => { localStorage.setItem('travel_data', JSON.stringify(travelData)); }, [travelData]);
            useEffect(() => { localStorage.setItem('debt_data', JSON.stringify(debtData)); }, [debtData]);

            return (
                <div className="flex h-screen overflow-hidden bg-slate-50">
                    {/* Sidebar 側邊欄 */}
                    <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800 shadow-xl z-20">
                        <div className="p-6 border-b border-slate-800 flex items-center space-x-3">
                            <div className="bg-indigo-600 text-white p-2.5 rounded-xl shadow-lg shadow-indigo-500/30">
                                <i className="fa-solid fa-chart-pie text-xl"></i>
                            </div>
                            <div>
                                <h1 className="font-bold text-white text-base tracking-wide">生活財務管家</h1>
                                <p className="text-xs text-slate-400">All-in-One Dashboard</p>
                            </div>
                        </div>

                        <nav className="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto custom-scrollbar">
                            {[
                                { id: 'dashboard', name: '綜合儀表板', icon: 'fa-house' },
                                { id: 'kmb', name: '九巴月票小幫手', icon: 'fa-bus' },
                                { id: 'dining', name: '食幾多慳幾多', icon: 'fa-utensils' },
                                { id: 'sport', name: '運動打卡', icon: 'fa-person-running' },
                                { id: 'wish', name: '心頭好儲蓄池', icon: 'fa-gift' },
                                { id: 'travel', name: '旅遊基金', icon: 'fa-plane-departure' },
                                { id: 'debt', name: '欠債/分期進度', icon: 'fa-file-invoice-dollar' },
                            ].map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setActiveTab(item.id)}
                                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition-all ${
                                        activeTab === item.id
                                            ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30 font-semibold'
                                            : 'hover:bg-slate-800 hover:text-white text-slate-400'
                                    }`}
                                >
                                    <i className={`fa-solid ${item.icon} w-5 text-center`}></i>
                                    <span>{item.name}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">
                            v3.5 Ultimate Edition
                        </div>
                    </aside>

                    {/* 主內容區 */}
                    <main className="flex-1 flex flex-col h-screen overflow-hidden">
                        <header className="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between shadow-xs z-10">
                            <div className="flex items-center space-x-2 text-slate-800 font-bold text-lg">
                                <i className={`fa-solid ${
                                    activeTab === 'dashboard' ? 'fa-house' :
                                    activeTab === 'kmb' ? 'fa-bus' :
                                    activeTab === 'dining' ? 'fa-utensils' :
                                    activeTab === 'sport' ? 'fa-person-running' :
                                    activeTab === 'wish' ? 'fa-gift' :
                                    activeTab === 'travel' ? 'fa-plane-departure' : 'fa-file-invoice-dollar'
                                } text-indigo-600`}></i>
                                <span>
                                    {activeTab === 'dashboard' && '綜合儀表板'}
                                    {activeTab === 'kmb' && '九巴月票小幫手'}
                                    {activeTab === 'dining' && '食幾多慳幾多 (餐飲理財)'}
                                    {activeTab === 'sport' && '運動打卡目標'}
                                    {activeTab === 'wish' && '心頭好儲蓄池'}
                                    {activeTab === 'travel' && '旅遊基金計劃'}
                                    {activeTab === 'debt' && '欠債與分期跟進'}
                                </span>
                            </div>
                            <div className="flex items-center space-x-4">
                                <span className="text-xs bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full font-semibold border border-indigo-100">
                                    <i className="fa-regular fa-calendar-days mr-1"></i> {new Date().toLocaleDateString()}
                                </span>
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto p-8 custom-scrollbar">
                            {activeTab === 'dashboard' && <DashboardView kmbData={kmbData} diningData={diningData} sportData={sportData} wishData={wishData} travelData={travelData} debtData={debtData} setActiveTab={setActiveTab} />}
                            {activeTab === 'kmb' && <KmbModule kmbData={kmbData} setKmbData={setKmbData} />}
                            {activeTab === 'dining' && <DiningModule diningData={diningData} setDiningData={setDiningData} />}
                            {activeTab === 'sport' && <SportModule sportData={sportData} setSportData={setSportData} />}
                            {activeTab === 'wish' && <WishModule wishData={wishData} setWishData={setWishData} />}
                            {activeTab === 'travel' && <TravelModule travelData={travelData} setTravelData={setTravelData} />}
                            {activeTab === 'debt' && <DebtModule debtData={debtData} setDebtData={setDebtData} />}
                        </div>
                    </main>
                </div>
            );
        }

        // --- 1. 綜合儀表板 ---
        function DashboardView({ kmbData, diningData, sportData, wishData, travelData, debtData, setActiveTab }) {
            // 九巴數據計算
            const kmbTotalSaved = useMemo(() => {
                const totalCost = kmbData.records.reduce((acc, r) => acc + r.fare, 0);
                return totalCost - kmbData.passPrice;
            }, [kmbData]);

            // 餐飲總結
            const diningTotalSaved = useMemo(() => {
                return diningData.history.reduce((acc, h) => acc + (h.savedAmount || 0), 0);
            }, [diningData]);

            // 運動達成率
            const sportCurrentMonthCount = useMemo(() => {
                const currentMonth = new Date().toISOString().slice(0, 7);
                return sportData.records.filter(r => r.date.startsWith(currentMonth)).length;
            }, [sportData]);

            // 總結卡片
            return (
                <div className="space-y-8 max-w-7xl mx-auto pb-12">
                    <div className="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-3xl p-8 text-white shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center">
                        <div className="space-y-2">
                            <h2 className="text-2xl font-bold tracking-tight">歡迎回來！管理好每一筆日常開支</h2>
                            <p className="text-indigo-100 text-sm max-w-xl">
                                結合交通、餐飲、運動與儲蓄目標，全方位掌控您的個人財務與健康狀況。
                            </p>
                        </div>
                        <div className="mt-6 md:mt-0 flex gap-3">
                            <button onClick={() => setActiveTab('kmb')} className="bg-white/10 hover:bg-white/20 text-white border border-white/20 font-semibold px-4 py-2.5 rounded-xl text-sm backdrop-blur-md transition-all">
                                <i className="fa-solid fa-bus mr-2"></i> 九巴月票
                            </button>
                            <button onClick={() => setActiveTab('dining')} className="bg-white text-indigo-600 hover:bg-indigo-50 font-semibold px-4 py-2.5 rounded-xl text-sm shadow-md transition-all">
                                <i className="fa-solid fa-utensils mr-2"></i> 食幾多慳幾多
                            </button>
                        </div>
                    </div>

                    {/* 數據快速預覽卡片 */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs flex items-center justify-between">
                            <div>
                                <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">九巴月票淨慳額</p>
                                <h3 className={`text-2xl font-bold mt-1 ${kmbTotalSaved >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                                    ${kmbTotalSaved.toFixed(1)}
                                </h3>
                                <p className="text-xs text-slate-500 mt-1">月票價值 ${kmbData.passPrice}</p>
                            </div>
                            <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
                                <i className="fa-solid fa-bus"></i>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs flex items-center justify-between">
                            <div>
                                <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">餐飲理財累計慳額</p>
                                <h3 className="text-2xl font-bold mt-1 text-indigo-600">${diningTotalSaved}</h3>
                                <p className="text-xs text-slate-500 mt-1">歷史週期記錄: {diningData.history.length} 個</p>
                            </div>
                            <div className="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl">
                                <i className="fa-solid fa-utensils"></i>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs flex items-center justify-between">
                            <div>
                                <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">本月運動進度</p>
                                <h3 className="text-2xl font-bold mt-1 text-amber-600">
                                    {sportCurrentMonthCount} / {sportData.monthlyTarget} <span className="text-sm font-normal text-slate-500">次</span>
                                </h3>
                                <p className="text-xs text-slate-500 mt-1">保持健康體態</p>
                            </div>
                            <div className="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-xl">
                                <i className="fa-solid fa-person-running"></i>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs flex items-center justify-between">
                            <div>
                                <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">心頭好 / 旅遊基金</p>
                                <h3 className="text-2xl font-bold mt-1 text-violet-600">
                                    {wishData.items.length + travelData.trips.length} <span className="text-sm font-normal text-slate-500">個項目</span>
                                </h3>
                                <p className="text-xs text-slate-500 mt-1">實現您的夢想清單</p>
                            </div>
                            <div className="w-12 h-12 bg-violet-50 text-violet-600 rounded-xl flex items-center justify-center text-xl">
                                <i className="fa-solid fa-gift"></i>
                            </div>
                        </div>
                    </div>

                    {/* 快捷導航模組 */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div onClick={() => setActiveTab('wish')} className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs hover:shadow-md cursor-pointer transition-all group">
                            <div className="flex items-center space-x-3 mb-3">
                                <div className="w-10 h-10 rounded-lg bg-pink-50 text-pink-600 flex items-center justify-center group-hover:scale-110 transition-transform">
                                    <i className="fa-solid fa-gift"></i>
                                </div>
                                <h4 className="font-bold text-slate-800">心頭好儲蓄池</h4>
                            </div>
                            <p className="text-sm text-slate-500">記錄您渴望入手的心頭好，設置儲蓄目標，一步步實現願望。</p>
                        </div>

                        <div onClick={() => setActiveTab('travel')} className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs hover:shadow-md cursor-pointer transition-all group">
                            <div className="flex items-center space-x-3 mb-3">
                                <div className="w-10 h-10 rounded-lg bg-cyan-50 text-cyan-600 flex items-center justify-center group-hover:scale-110 transition-transform">
                                    <i className="fa-solid fa-plane-departure"></i>
                                </div>
                                <h4 className="font-bold text-slate-800">旅遊基金</h4>
                            </div>
                            <p className="text-sm text-slate-500">計劃下一場說走就走的旅行，管理預算、儲蓄與行程預備金。</p>
                        </div>

                        <div onClick={() => setActiveTab('debt')} className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs hover:shadow-md cursor-pointer transition-all group">
                            <div className="flex items-center space-x-3 mb-3">
                                <div className="w-10 h-10 rounded-lg bg-red-50 text-red-600 flex items-center justify-center group-hover:scale-110 transition-transform">
                                    <i className="fa-solid fa-file-invoice-dollar"></i>
                                </div>
                                <h4 className="font-bold text-slate-800">欠債與分期跟進</h4>
                            </div>
                            <p className="text-sm text-slate-500">清清楚楚掌握每一筆分期付款及欠款，告別財政混亂。</p>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 2. 九巴月票小幫手 ---
        function KmbModule({ kmbData, setKmbData }) {
            const [fareInput, setFareInput] = useState('');
            const [dateInput, setDateInput] = useState(new Date().toISOString().split('T')[0]);
            const [noteInput, setNoteInput] = useState('');

            const handleAddRecord = (e) => {
                e.preventDefault();
                if (!fareInput || isNaN(fareInput)) return;
                const newRecord = {
                    id: Date.now(),
                    date: dateInput,
                    fare: parseFloat(fareInput),
                    note: noteInput || '九巴車程'
                };
                setKmbData({
                    ...kmbData,
                    records: [newRecord, ...kmbData.records]
                });
                setFareInput('');
                setNoteInput('');
            };

            const handleDeleteRecord = (id) => {
                setKmbData({
                    ...kmbData,
                    records: kmbData.records.filter(r => r.id !== id)
                });
            };

            const totalRides = kmbData.records.length;
            const totalFare = kmbData.records.reduce((acc, r) => acc + r.fare, 0);
            const netSaved = totalFare - kmbData.passPrice;

            return (
                <div className="max-w-6xl mx-auto space-y-8 pb-12">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs">
                            <p className="text-xs font-semibold text-slate-400 uppercase">總乘搭次數</p>
                            <h3 className="text-3xl font-extrabold text-slate-800 mt-1">{totalRides} <span className="text-sm font-normal text-slate-500">轉</span></h3>
                        </div>
                        <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs">
                            <p className="text-xs font-semibold text-slate-400 uppercase">已節省車資總額</p>
                            <h3 className={`text-3xl font-extrabold mt-1 ${netSaved >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                                ${netSaved.toFixed(1)}
                            </h3>
                            <p className="text-xs text-slate-500 mt-1">累計原價: ${totalFare.toFixed(1)} / 月票費: ${kmbData.passPrice}</p>
                        </div>
                        <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs flex flex-col justify-between">
                            <div>
                                <p className="text-xs font-semibold text-slate-400 uppercase">月票設定</p>
                                <div className="flex items-center space-x-2 mt-2">
                                    <span className="text-sm text-slate-600">價格 ($):</span>
                                    <input 
                                        type="number" 
                                        value={kmbData.passPrice} 
                                        onChange={(e) => setKmbData({...kmbData, passPrice: parseFloat(e.target.value) || 0})}
                                        className="w-24 px-3 py-1.5 border border-slate-200 rounded-lg text-sm font-semibold focus:outline-indigo-500"
                                    />
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 記錄表單 */}
                    <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs">
                        <h3 className="font-bold text-slate-800 text-base mb-4"><i className="fa-solid fa-plus-circle text-indigo-600 mr-2"></i> 新增九巴車程記錄</h3>
                        <form onSubmit={handleAddRecord} className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1">日期</label>
                                <input 
                                    type="date" 
                                    value={dateInput} 
                                    onChange={(e) => setDateInput(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-indigo-500"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1">車資 ($)</label>
                                <input 
                                    type="number" 
                                    step="0.1" 
                                    placeholder="例如: 15.4"
                                    value={fareInput} 
                                    onChange={(e) => setFareInput(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-indigo-500"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1">備註 / 路線</label>
                                <input 
                                    type="text" 
                                    placeholder="例如: 960 返工"
                                    value={noteInput} 
                                    onChange={(e) => setNoteInput(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-indigo-500"
                                />
                            </div>
                            <div className="flex items-end">
                                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-xl text-sm transition-all shadow-md shadow-indigo-600/20">
                                    新增記錄
                                </button>
                            </div>
                        </form>
                    </div>

                    {/* 記錄列表 */}
                    <div className="bg-white rounded-2xl border border-slate-100 shadow-xs overflow-hidden">
                        <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                            <h3 className="font-bold text-slate-800 text-base">車程明細列表</h3>
                            <span className="text-xs text-slate-400">共 {kmbData.records.length} 筆記錄</span>
                        </div>
                        {kmbData.records.length === 0 ? (
                            <div className="p-12 text-center text-slate-400 text-sm">尚無車程記錄，請於上方新增。</div>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse text-sm">
                                    <thead>
                                        <tr className="bg-slate-50 text-slate-400 font-semibold text-xs border-b border-slate-100">
                                            <th className="py-3 px-6">日期</th>
                                            <th className="py-3 px-6">備註 / 路線</th>
                                            <th className="py-3 px-6">車資</th>
                                            <th className="py-3 px-6 text-right">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {kmbData.records.map((r) => (
                                            <tr key={r.id} className="hover:bg-slate-50 transition-colors">
                                                <td className="py-3 px-6 text-slate-600">{r.date}</td>
                                                <td className="py-3 px-6 font-medium text-slate-800">{r.note}</td>
                                                <td className="py-3 px-6 text-emerald-600 font-semibold">${r.fare.toFixed(1)}</td>
                                                <td className="py-3 px-6 text-right">
                                                    <button onClick={() => handleDeleteRecord(r.id)} className="text-slate-400 hover:text-rose-600 transition-colors p-1">

        // --- 3. 食幾多慳幾多 (餐飲理財模組) ---

            // 當前選中的週期 index，預設為最新一個
            const [selectedCycleIndex, setSelectedCycleIndex] = useState(() => {
                return diningData.history.length > 0 ? diningData.history.length - 1 : 0;
            });

            // 確保 index 在有效範圍內
            const currentCycle = diningData.history[selectedCycleIndex] || {
                id: Date.now(),
                cycleName: '新週期',
                startLuxuryCount: 3,
                currentLuxuryCount: 3,
                savedAmount: 0,
                notes: ''
            };

            const handleUpdateCurrentCycle = (field, val) => {
                const updatedHistory = [...diningData.history];
                updatedHistory[selectedCycleIndex] = {
                    ...currentCycle,
                    [field]: val
                };
                setDiningData({ ...diningData, history: updatedHistory });
            };

            const handleAddNewCycle = () => {
                const newCycle = {
                    id: Date.now(),
                    cycleName: `第 ${diningData.history.length + 1} 期週期`,
                    startLuxuryCount: 3,
                    currentLuxuryCount: 3,
                    savedAmount: 450,
                    notes: '新開立週期'
                };
                setDiningData({
                    ...diningData,
                    history: [...diningData.history, newCycle]
                });
                setSelectedCycleIndex(diningData.history.length);
            };

            const handleDeleteCycle = (indexToDelete) => {
                if (diningData.history.length <= 1) {
                    alert('最少需要保留一個週期記錄！');
                    return;
                }
                const updatedHistory = diningData.history.filter((_, idx) => idx !== indexToDelete);
                setDiningData({ ...diningData, history: updatedHistory });
                setSelectedCycleIndex(Math.max(0, indexToDelete - 1));
            };

            return (

                                    className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${

                            <h3 className="font-bold text-slate-800 text-base"><i className="fa-solid fa-sliders text-indigo-600 mr-2"></i> 週期參數設定</h3>
                            
                            <div>

                            <div>

                                    type="number" 
                                    value={currentCycle.savedAmount} 
                                    onChange={(e) => handleUpdateCurrentCycle('savedAmount', parseFloat(e.target.value) || 0)}

                                />

                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1">備註說明</label>

                                    <span>刪除此週期記錄</span>
                                </button>
                            </div>
                        </div>

                        {/* 視覺化成果顯示 */}
                        <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs md:col-span-2 flex flex-col justify-between space-y-6">
                            <div>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-slate-800 text-base"><i className="fa-solid fa-chart-line text-indigo-600 mr-2"></i> 飲食理財成果分析: {currentCycle.cycleName}</h3>

                                <p className="text-sm text-slate-500">

                                </p>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">

                            </div>

                            <div className="bg-indigo-50/50 border border-indigo-100 p-4 rounded-xl text-xs text-indigo-900 flex items-center space-x-3">
                                <i className="fa-solid fa-lightbulb text-indigo-600 text-lg"></i>
                                <div>
                                    <span className="font-bold">理財小貼士：</span> 隨時切換前後週期，並可自由編輯結算次數與累計節省金額，助您精準評估飲食習慣改變帶來的財務成果。
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

        // --- 4. 運動打卡模組 ---

                setSportData({

                            </p>
                        </div>
                    </div>

                    {/* 打卡表單 */}
                    <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs">
                        <h3 className="font-bold text-slate-800 text-base mb-4"><i className="fa-solid fa-person-running text-amber-600 mr-2"></i> 新增運動打卡</h3>
                        <form onSubmit={handleAddRecord} className="grid grid-cols-1 md:grid-cols-5 gap-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1">日期</label>
                                <input 
                                    type="date" 
                                    value={dateInput} 
                                    onChange={(e) => setDateInput(e.target.value)}

                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1">運動類型</label>

        // --- 5. 心頭好儲蓄池模組 ---
        function WishModule({ wishData, setWishData }) {
            const [nameInput, setNameInput] = useState('');
            const [priceInput, setPriceInput] = useState('');
            const [savedInput, setSavedInput] = useState('');

            const handleAddItem = (e) => {
                e.preventDefault();
                if (!nameInput || !priceInput) return;
                const newItem = {
                    id: Date.now(),
                    name: nameInput,
                    price: parseFloat(priceInput) || 0,
                    saved: parseFloat(savedInput) || 0
                };
                setWishData({
                    ...wishData,
                    items: [newItem, ...wishData.items]
                });
                setNameInput('');
                setPriceInput('');
                setSavedInput('');
            };

            const handleUpdateSaved = (id, amount) => {
                const updatedItems = wishData.items.map(item => {
                    if (item.id === id) {
                        const newSaved = Math.max(0, item.saved + amount);
                        return { ...item, saved: newSaved };
                    }
                    return item;
                });
                setWishData({ ...wishData, items: updatedItems });
            };

            const handleDeleteItem = (id) => {
                setWishData({
                    ...wishData,
                    items: wishData.items.filter(i => i.id !== id)
                });
            };

            return (
                <div className="max-w-6xl mx-auto space-y-8 pb-12">
                    <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs">
                        <h3 className="font-bold text-slate-800 text-base mb-4"><i className="fa-solid fa-gift text-pink-600 mr-2"></i> 新增心頭好目標</h3>

                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1">物品名稱</label>
                                <input 
                                    type="text" 
                                    placeholder="例如: 最新手提電腦" 
                                    value={nameInput} 
                                    onChange={(e) => setNameInput(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-pink-500"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1">目標金額 ($)</label>
                                <input 
                                    type="number" 
                                    placeholder="例如: 8999" 
                                    value={priceInput} 
                                    onChange={(e) => setPriceInput(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-pink-500"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1">已存金額 ($)</label>
                                <input 
                                    type="number" 
                                    placeholder="例如: 1500" 
                                    value={savedInput} 
                                    onChange={(e) => setSavedInput(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-pink-500"
                                />
                            </div>
                            <div className="flex items-end">
                                <button type="submit" className="w-full bg-pink-600 hover:bg-pink-700 text-white font-semibold py-2 px-4 rounded-xl text-sm transition-all shadow-md shadow-pink-600/20">
                                    加入心頭好池
                                </button>
                            </div>
                        </form>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {wishData.items.map(item => {
                            const percent = Math.min(100, Math.round((item.saved / item.price) * 100));
                            return (
                                <div key={item.id} className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs flex flex-col justify-between space-y-4">
                                    <div>
                                        <div className="flex justify-between items-start mb-2">
                                            <h4 className="font-bold text-slate-800 text-base">{item.name}</h4>
                                            <button onClick={() => handleDeleteItem(item.id)} className="text-slate-400 hover:text-rose-600">
                                                <i className="fa-solid fa-trash-can text-xs"></i>
                                            </button>
                                        </div>
                                        <div className="flex justify-between text-xs text-slate-500 mb-1">
                                            <span>已存: <strong className="text-pink-600">${item.saved}</strong></span>
                                            <span>目標: <strong>${item.price}</strong></span>
                                        </div>
                                        <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                            <div className="bg-pink-500 h-full rounded-full transition-all duration-300" style={{ width: `${percent}%` }}></div>
                                        </div>
                                        <div className="text-right text-xs font-semibold text-slate-400 mt-1">{percent}% 完成</div>
                                    </div>

                                    <div className="flex gap-2 pt-2 border-t border-slate-100">
                                        <button onClick={() => handleUpdateSaved(item.id, 100)} className="flex-1 bg-pink-50 hover:bg-pink-100 text-pink-700 font-semibold py-1.5 rounded-lg text-xs transition-colors">
                                            + $100
                                        </button>
                                        <button onClick={() => handleUpdateSaved(item.id, 500)} className="flex-1 bg-pink-50 hover:bg-pink-100 text-pink-700 font-semibold py-1.5 rounded-lg text-xs transition-colors">
                                            + $500
                                        </button>
                                        <button onClick={() => handleUpdateSaved(item.id, 1000)} className="flex-1 bg-pink-50 hover:bg-pink-100 text-pink-700 font-semibold py-1.5 rounded-lg text-xs transition-colors">
                                            + $1000
                                        </button>
                                    </div>
                                </div>

                    </div>
                    {wishData.items.length === 0 && (
                        <div className="bg-white p-12 rounded-2xl border border-slate-100 text-center text-slate-400 text-sm">
                            尚無心頭好項目，請於上方新增您的夢想清單。
                        </div>
                    )}
                </div>
            );
        }

        // --- 6. 旅遊基金模組 ---
        function TravelModule({ travelData, setTravelData }) {
            const [destInput, setDestInput] = useState('');
            const [budgetInput, setBudgetInput] = useState('');
            const [savedInput, setSavedInput] = useState('');
            const [dateInput, setDateInput] = useState('');

            const handleAddTrip = (e) => {
                e.preventDefault();
                if (!destInput || !budgetInput) return;
                const newTrip = {
                    id: Date.now(),
                    destination: destInput,
                    budget: parseFloat(budgetInput) || 0,
                    saved: parseFloat(savedInput) || 0,
                    date: dateInput || '未定日期'
                };
                setTravelData({
                    ...travelData,
                    trips: [newTrip, ...travelData.trips]
                });
                setDestInput('');
                setBudgetInput('');
                setSavedInput('');
                setDateInput('');
            };

            const handleUpdateSaved = (id, amount) => {
                const updatedTrips = travelData.trips.map(trip => {
                    if (trip.id === id) {
                        const newSaved = Math.max(0, trip.saved + amount);
                        return { ...trip, saved: newSaved };
                    }
                    return trip;
                });
                setTravelData({ ...travelData, trips: updatedTrips });
            };

            const handleDeleteTrip = (id) => {
                setTravelData({
                    ...travelData,
                    trips: travelData.trips.filter(t => t.id !== id)
                });
            };

            return (
                <div className="max-w-6xl mx-auto space-y-8 pb-12">
                    <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs">
                        <h3 className="font-bold text-slate-800 text-base mb-4"><i className="fa-solid fa-plane-departure text-cyan-600 mr-2"></i> 規劃新旅遊基金</h3>
                        <form onSubmit={handleAddTrip} className="grid grid-cols-1 md:grid-cols-5 gap-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1">目的地</label>
                                <input 
                                    type="text" 
                                    placeholder="例如: 日本東京" 
                                    value={destInput} 
                                    onChange={(e) => setDestInput(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-cyan-500"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1">預算金額 ($)</label>
                                <input 
                                    type="number" 
                                    placeholder="例如: 12000" 
                                    value={budgetInput} 
                                    onChange={(e) => setBudgetInput(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-cyan-500"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1">已存金額 ($)</label>
                                <input 
                                    type="number" 
                                    placeholder="例如: 3000" 
                                    value={savedInput} 
                                    onChange={(e) => setSavedInput(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-cyan-500"
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1">預計出發日期</label>
                                <input 
                                    type="date" 
                                    value={dateInput} 
                                    onChange={(e) => setDateInput(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-cyan-500"
                                />
                            </div>
                            <div className="flex items-end">
                                <button type="submit" className="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-semibold py-2 px-4 rounded-xl text-sm transition-all shadow-md shadow-cyan-600/20">
                                    新增行程
                                </button>
                            </div>
                        </form>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {travelData.trips.map(trip => {
                            const percent = Math.min(100, Math.round((trip.saved / trip.budget) * 100));
                            return (
                                <div key={trip.id} className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs flex flex-col justify-between space-y-4">
                                    <div>
                                        <div className="flex justify-between items-start mb-2">
                                            <h4 className="font-bold text-slate-800 text-base">{trip.destination}</h4>
                                            <button onClick={() => handleDeleteTrip(trip.id)} className="text-slate-400 hover:text-rose-600">
                                                <i className="fa-solid fa-trash-can text-xs"></i>
                                            </button>
                                        </div>
                                        <p className="text-xs text-slate-400 mb-3"><i className="fa-regular fa-calendar mr-1"></i> 出發日: {trip.date}</p>
                                        <div className="flex justify-between text-xs text-slate-500 mb-1">
                                            <span>已存: <strong className="text-cyan-600">${trip.saved}</strong></span>
                                            <span>預算: <strong>${trip.budget}</strong></span>
                                        </div>
                                        <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                            <div className="bg-cyan-500 h-full rounded-full transition-all duration-300" style={{ width: `${percent}%` }}></div>
                                        </div>
                                        <div className="text-right text-xs font-semibold text-slate-400 mt-1">{percent}% 達成</div>
                                    </div>

                                    <div className="flex gap-2 pt-2 border-t border-slate-100">
                                        <button onClick={() => handleUpdateSaved(trip.id, 500)} className="flex-1 bg-cyan-50 hover:bg-cyan-100 text-cyan-700 font-semibold py-1.5 rounded-lg text-xs transition-colors">
                                            + $500
                                        </button>
                                        <button onClick={() => handleUpdateSaved(trip.id, 1000)} className="flex-1 bg-cyan-50 hover:bg-cyan-100 text-cyan-700 font-semibold py-1.5 rounded-lg text-xs transition-colors">
                                            + $1000
                                        </button>
                                        <button onClick={() => handleUpdateSaved(trip.id, 2000)} className="flex-1 bg-cyan-50 hover:bg-cyan-100 text-cyan-700 font-semibold py-1.5 rounded-lg text-xs transition-colors">
                                            + $2000
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    {travelData.trips.length === 0 && (
                        <div className="bg-white p-12 rounded-2xl border border-slate-100 text-center text-slate-400 text-sm">
                            尚無旅遊基金計劃，立即開始規劃您的下一次旅程！
                        </div>
                    )}
                </div>
            );
        }

        // --- 7. 欠債與分期跟進模組 ---
        function DebtModule({ debtData, setDebtData }) {
            const [nameInput, setNameInput] = useState('');
            const [totalInput, setTotalInput] = useState('');
            const [paidInput, setPaidInput] = useState('');
            const [monthlyInput, setMonthlyInput] = useState('');

            const handleAddLoan = (e) => {
                e.preventDefault();
                if (!nameInput || !totalInput) return;
                const newLoan = {
                    id: Date.now(),
                    name: nameInput,
                    total: parseFloat(totalInput) || 0,
                    paid: parseFloat(paidInput) || 0,
                    monthly: parseFloat(monthlyInput) || 0
                };
                setDebtData({
                    ...debtData,
                    loans: [newLoan, ...debtData.loans]
                });
                setNameInput('');
                setTotalInput('');
                setPaidInput('');
                setMonthlyInput('');
            };

            const handlePayInstallment = (id, amount) => {
                const updatedLoans = debtData.loans.map(loan => {
                    if (loan.id === id) {
                        const newPaid = Math.min(loan.total, loan.paid + amount);
                        return { ...loan, paid: newPaid };
                    }
                    return loan;
                });
                setDebtData({ ...debtData, loans: updatedLoans });
            };

            const handleDeleteLoan = (id) => {
                setDebtData({
                    ...debtData,
                    loans: debtData.loans.filter(l => l.id !== id)
                });
            };

            return (
                <div className="max-w-6xl mx-auto space-y-8 pb-12">
                    <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs">
                        <h3 className="font-bold text-slate-800 text-base mb-4"><i className="fa-solid fa-file-invoice-dollar text-rose-600 mr-2"></i> 新增欠款 / 分期付款項目</h3>
                        <form onSubmit={handleAddLoan} className="grid grid-cols-1 md:grid-cols-5 gap-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1">項目名稱</label>
                                <input 
                                    type="text" 
                                    placeholder="例如: 信用卡分期 / 銀行貸款" 
                                    value={nameInput} 
                                    onChange={(e) => setNameInput(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-rose-500"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1">總金額 ($)</label>
                                <input 
                                    type="number" 
                                    placeholder="例如: 15000" 
                                    value={totalInput} 
                                    onChange={(e) => setTotalInput(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-rose-500"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1">已還金額 ($)</label>
                                <input 
                                    type="number" 
                                    placeholder="例如: 3000" 
                                    value={paidInput} 
                                    onChange={(e) => setPaidInput(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-rose-500"
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1">每月還款額 ($)</label>
                                <input 
                                    type="number" 
                                    placeholder="例如: 1500" 
                                    value={monthlyInput} 
                                    onChange={(e) => setMonthlyInput(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-rose-500"
                                />
                            </div>
                            <div className="flex items-end">
                                <button type="submit" className="w-full bg-rose-600 hover:bg-rose-700 text-white font-semibold py-2 px-4 rounded-xl text-sm transition-all shadow-md shadow-rose-600/20">
                                    新增項目
                                </button>
                            </div>
                        </form>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {debtData.loans.map(loan => {
                            const remaining = Math.max(0, loan.total - loan.paid);
                            const percent = Math.min(100, Math.round((loan.paid / loan.total) * 100));
                            return (
                                <div key={loan.id} className="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs flex flex-col justify-between space-y-4">
                                    <div>
                                        <div className="flex justify-between items-start mb-2">
                                            <h4 className="font-bold text-slate-800 text-base">{loan.name}</h4>
                                            <button onClick={() => handleDeleteLoan(loan.id)} className="text-slate-400 hover:text-rose-600">
                                                <i className="fa-solid fa-trash-can text-xs"></i>
                                            </button>
                                        </div>
                                        <div className="flex justify-between text-xs text-slate-500 mb-1">
                                            <span>已還: <strong className="text-emerald-600">${loan.paid}</strong></span>
                                            <span>剩餘: <strong className="text-rose-600">${remaining}</strong></span>
                                        </div>
                                        <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                            <div className="bg-emerald-500 h-full rounded-full transition-all duration-300" style={{ width: `${percent}%` }}></div>
                                        </div>
                                        <div className="flex justify-between text-xs text-slate-400 mt-1">
                                            <span>總計: ${loan.total}</span>
                                            <span>每月: ${loan.monthly}</span>
                                        </div>
                                    </div>

                                    <div className="flex gap-2 pt-2 border-t border-slate-100">
                                        {loan.monthly > 0 && (
                                            <button onClick={() => handlePayInstallment(loan.id, loan.monthly)} className="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold py-1.5 rounded-lg text-xs transition-colors">
                                                還一期 (${loan.monthly})
                                            </button>
                                        )}
                                        <button onClick={() => handlePayInstallment(loan.id, 1000)} className="flex-1 bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold py-1.5 rounded-lg text-xs transition-colors">
                                            + $1000
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    {debtData.loans.length === 0 && (
                        <div className="bg-white p-12 rounded-2xl border border-slate-100 text-center text-slate-400 text-sm">
                            太棒了！目前沒有記錄任何欠債或分期項目。
                        </div>
                    )}
                </div>
            );
        }

        // 渲染應用
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
